<div class="container">

    <h4 class="center grey-text text-darken-2">

        Platillos

    </h4>

    <div class="recipes">

    </div>

</div>

<div class="fixed-action-btn">

    <a class="btn-floating btn-large red sidenav-trigger"
       data-target="side-form">

        <i class="material-icons">

            add

        </i>

    </a>

</div>

<div id="side-form" class="sidenav">

<form class="add-recipe container section">

<h5 class="center">

Nuevo Platillo

</h5>

<div class="divider"></div>

<div class="input-field">

<input
id="title"
name="title"
type="text"
required>

<label for="title">

Nombre del platillo

</label>

</div>

<div class="input-field">

<input
id="ingredients"
name="ingredients"
type="text"
required>

<label for="ingredients">

Ingredientes

</label>

</div>

<div class="input-field">

<input
id="price"
name="price"
type="number"
required>

<label for="price">

Precio

</label>

</div>

<div class="center">

<button
id="btnAgregarPlatillo"
type="submit"
class="btn green waves-effect waves-light">

Agregar Platillo

</button>

</div>

</form>

</div>
